name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v10
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Generated API client is up to date
        run: pnpm generate && git diff --exit-code

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/conventional-commit.sh "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  # Runs only once the repository variable DEPLOY_HOST is set. See README > Deploy.
  deploy:
    if: github.event_name == 'push' && vars.DEPLOY_HOST != ''
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart the stack on the VPS
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd cropilot && git pull --ff-only && docker compose -f compose.prod.yml up -d --build'
