packages:
  - apps/*
  - packages/*

# Versions shared by more than one package. Reference them with "catalog:".
catalog:
  # React is pinned to the exact version the Expo SDK requires, so web and
  # mobile share a single copy. Bump it together with the Expo SDK.
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": ~19.3.0
  "@types/react-dom": ^19
  "@tanstack/react-query": ^5.107.1
  "@tanstack/react-form": ^1.33.5
  # 6.x: the API client generator does not support TypeScript 7 yet.
  typescript: ~6.0.3
  "@types/node": ^24

allowBuilds:
  esbuild: true
  lefthook: true
