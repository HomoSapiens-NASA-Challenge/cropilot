[project]
name = "cropilot-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "openai>=3.51.0",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "rotation-sim",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.ruff]
line-length = 100
# Vendored third-party code keeps its own style (scripts/rotation_sim/install.sh).
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "ANN", "ASYNC", "PT", "PTH", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["ANN"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s"
prepend_sys_path = ["."]

[[tool.alembic.post_write_hooks]]
name = "ruff-fix"
type = "module"
module = "ruff"
options = "check --fix --quiet REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff-format"
type = "module"
module = "ruff"
options = "format --quiet REVISION_SCRIPT_FILENAME"

[tool.uv.sources]
rotation-sim = { path = "vendor/rotation-sim" }
