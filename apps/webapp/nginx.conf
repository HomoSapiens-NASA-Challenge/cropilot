server {
  listen 80;
  root /usr/share/nginx/html;

  # Build assets carry a content hash in their name, so they never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # /api belongs to the auth and backend services. A request only lands here
  # while they are down, and it must fail instead of returning the app shell.
  location /api/ {
    return 503;
  }

  # Client-side routing: unknown paths fall back to the app shell.
  location / {
    try_files $uri /index.html;
  }
}
